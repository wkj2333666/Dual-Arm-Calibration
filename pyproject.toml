[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-arm-calibration"
version = "0.5.0"
description = "Hardware-independent calibration for two arms, two wrist cameras and one fixed camera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-contrib-python-headless>=4.8,<5"]

[project.optional-dependencies]
depth = ["pyrealsense2"]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.scripts]
dual-arm-calibration = "dual_arm_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_arm_calibration = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/dual-arm-calibration/skills/dual-arm-calibration" = ["skills/dual-arm-calibration/SKILL.md"]
"share/dual-arm-calibration/docs" = ["docs/workflow.md", "docs/data-format.md", "docs/adapters.md", "docs/provenance.json", "docs/validation.md", "docs/web.md", "docs/piper.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]
